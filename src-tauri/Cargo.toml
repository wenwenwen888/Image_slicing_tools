[package]
name = "image-slicing-tools"
version = "0.1.4"
description = "Cross-platform image slicing workspace"
authors = ["Image Slicing Tools"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "image_slicing_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
