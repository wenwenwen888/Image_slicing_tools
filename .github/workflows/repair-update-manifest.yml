name: Repair Updater Manifest

on:
  push:
    tags:
      - "manifest-v*"

jobs:
  publish-update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-update-manifest.sh "${GITHUB_REF_NAME#manifest-}"
